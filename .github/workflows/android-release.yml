name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "APK 内加载的站点地址（留空则使用仓库变量 APP_URL，再为空则用占位地址）"
        required: false
        type: string
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url || vars.APP_URL || 'https://example.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          SHELLKEYSTOREBASE64: ${{ secrets.SHELLKEYSTOREBASE64 }}
          SHELLKEYSTOREPASSWORD: ${{ secrets.SHELLKEYSTOREPASSWORD }}
          SHELLKEYALIAS: ${{ secrets.SHELLKEYALIAS }}
          SHELLKEYPASSWORD: ${{ secrets.SHELLKEYPASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SHELLKEYSTOREBASE64 SHELLKEYSTOREPASSWORD SHELLKEYALIAS SHELLKEYPASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 Secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore signing keystore
        env:
          SHELLKEYSTOREBASE64: ${{ secrets.SHELLKEYSTOREBASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SHELLKEYSTOREBASE64" | base64 -d > android/app/release.jks
          test -s android/app/release.jks

      - name: Build signed release APK
        env:
          SHELLKEYSTOREPASSWORD: ${{ secrets.SHELLKEYSTOREPASSWORD }}
          SHELLKEYALIAS: ${{ secrets.SHELLKEYALIAS }}
          SHELLKEYPASSWORD: ${{ secrets.SHELLKEYPASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease \
            -PappUrl="$APP_URL" \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="1.0.${GITHUB_RUN_NUMBER}"

      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.jks

      - name: Collect and verify APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_NAME="doremy-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)"
          "$APKSIGNER" verify --print-certs "dist/$APK_NAME" | sed -n '1,6p'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doremy-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
